services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: codedoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codedoc
      POSTGRES_USER: codedoc
      POSTGRES_PASSWORD: codedoc
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codedoc -d codedoc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
